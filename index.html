<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E6">
<title>ร้านแม่อัมพร</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>

<body>

<header>
  <svg width="60" height="60" viewBox="0 0 64 64" aria-label="โลโก้ร้านแม่อัมพร">
    <path d="M10 28c-3-3 3-5 0-9" fill="none" stroke="#A9D8C3" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 30c-3-3 3-5 0-9" fill="none" stroke="#A9D8C3" stroke-width="2" stroke-linecap="round"/>
    <g fill="none" stroke="#E9C46A" stroke-width="2.4" stroke-linecap="round">
      <path d="M29 20C25 26 34 28 30 32C28 35 31 36 30 40"/>
      <path d="M33 22C30 28 38 30 34 34C33 36 35 37 35 40"/>
      <path d="M37 24C35 29 41 31 38 35C37 37 39 38 39 40"/>
    </g>
    <line x1="52" y1="3"  x2="28" y2="20" stroke="#B5835A" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="60" y1="10" x2="37" y2="26" stroke="#C99A6E" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M23 58h18l-2 4H25z" fill="#D9777A"/>
    <path d="M6 36h52c0 14-11 22-26 22S6 50 6 36z" fill="#F2A3A0"/>
    <rect x="4" y="33" width="56" height="5" rx="2.5" fill="#D9777A"/>
    <circle cx="32" cy="48" r="3" fill="#FFFBF5" opacity=".8"/>
    <circle cx="20" cy="45" r="1.6" fill="#FFFBF5" opacity=".7"/>
    <circle cx="44" cy="45" r="1.6" fill="#FFFBF5" opacity=".7"/>
  </svg>
  <div class="brand">
    <h1>ร้านแม่อัมพร</h1>
    <p>ก๋วยเตี๋ยว · 麵</p>
  </div>
</header>

<main>
  <!-- แถบเมนู (แสดงหลังใส่ PIN) -->
  <nav class="tabs hidden" id="tabs">
    <button class="tab active" id="tabPay">คิดเงิน</button>
    <button class="tab" id="tabSum">สรุปยอดขาย</button>
    <button class="tab tab-lock" id="btnLock" title="ล็อกหน้าจอ" aria-label="ล็อกหน้าจอ">🔒</button>
  </nav>

  <!-- หน้าใส่ PIN -->
  <section class="card lock" id="screenLock">
    <div class="lock-icon">🔒</div>
    <label for="pinInput">ใส่รหัส PIN เพื่อเข้าใช้งาน</label>
    <div class="amount-box">
      <input id="pinInput" class="pin-input" type="password" inputmode="numeric"
             maxlength="8" placeholder="••••" autocomplete="off">
    </div>
    <button class="btn btn-rose" id="btnLogin">เข้าสู่ระบบ</button>
  </section>

  <!-- หน้ากรอกยอด -->
  <section class="card hidden" id="screenInput">
    <label for="amount">ยอดที่ต้องชำระ (บาท)</label>
    <div class="amount-box">
      <span>฿</span>
      <input id="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
    </div>
    <button class="btn btn-rose" id="btnCreate">สร้าง QR Code</button>
  </section>

  <!-- หน้าแสดง QR -->
  <section class="card pay hidden" id="screenQR">
    <div class="tag">ยอดที่ต้องโอน</div>
    <div class="total"><span id="showAmount">0.00</span><small>บาท</small></div>
    <div class="qr-wrap" id="qrBox"></div>
    <div class="name" id="accName"></div>
    <div class="sub">สแกนจ่ายผ่านแอปธนาคารได้ทุกธนาคาร</div>
    <button class="btn btn-jade" id="btnPaid">ลูกค้าโอนแล้ว · บันทึกยอดขาย</button>
    <button class="btn btn-ghost" id="btnBack">ยกเลิก / แก้ไขยอด</button>
  </section>

  <!-- หน้าบันทึกสำเร็จ -->
  <section class="card done hidden" id="screenDone">
    <div class="check">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h2>รับชำระเรียบร้อย</h2>
    <p>บันทึกยอดขายลง Google Sheet แล้ว</p>
    <div class="amt" id="doneAmount"></div>
    <button class="btn btn-rose" id="btnNew">คิดเงินรายการใหม่</button>
  </section>

  <!-- หน้าสรุปยอดขาย -->
  <section class="card summary hidden" id="screenSummary">
    <input type="date" id="sumDate" class="date-input">
    <div class="sum-total">
      <div class="tag">ยอดขายรวม</div>
      <div class="big"><span id="sumTotal">0.00</span><small>บาท</small></div>
      <div class="cnt" id="sumCount">0 รายการ</div>
    </div>

    <div class="sub-title">7 วันล่าสุด</div>
    <div class="week" id="sumWeek"></div>

    <div class="sub-title">รายการของวันนี้</div>
    <div class="list" id="sumList"></div>

    <button class="btn btn-ghost" id="btnRefresh">รีเฟรชข้อมูล</button>
  </section>
</main>

<div id="toast"></div>
<footer>ร้านแม่อัมพร</footer>

<script src="app.js"></script>
</body>
</html>
